name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secret opsional. Jika diisi, APK ditandatangani dengan keystore yang sama di setiap build.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Siapkan keystore (jika secret tersedia)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore dari secret dipakai."
          else
            echo "::warning::Secret KEYSTORE_BASE64 kosong: APK memakai debug key acak per-build (tidak bisa menimpa instalasi lama)."
          fi

      - name: Unit test
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Android Lint
        run: gradle lintDebug --no-daemon

      - name: Build debug dan release
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verifikasi APK (ID aplikasi, versi, tanda tangan)
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "=== $apk"
            "$BT/aapt2" dump badging "$apk" | grep -E "^package:|application-label:|sdkVersion|targetSdkVersion"
            "$BT/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verifies|Number of signers|SHA-256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Screen-Recorder-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Laporan-Lint-dan-Test
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
